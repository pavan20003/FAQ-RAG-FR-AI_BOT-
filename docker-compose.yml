services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: faqrag
      POSTGRES_USER: faqrag
      POSTGRES_PASSWORD: faqrag
    command: ["postgres"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faqrag -d faqrag"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://faqrag:faqrag@db:5432/faqrag
      HF_HOME: /model-cache
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_cache:/model-cache

volumes:
  postgres_data:
  model_cache:
