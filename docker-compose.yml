services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faqrag}
      POSTGRES_USER: ${POSTGRES_USER:-faqrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faqrag}
    ports:
      - "127.0.0.1:5432:5432"
    command: ["postgres"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faqrag -d faqrag"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-faqrag}:${POSTGRES_PASSWORD:-faqrag}@db:5432/${POSTGRES_DB:-faqrag}
      HF_HOME: /model-cache
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_cache:/model-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 20m
      retries: 3

volumes:
  postgres_data:
  model_cache:
