name: CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: faqrag
          POSTGRES_USER: faqrag
          POSTGRES_PASSWORD: faqrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faqrag -d faqrag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline tests
        env:
          DATABASE_URL: postgresql://faqrag:faqrag@localhost:5432/faqrag
        run: pytest -q
      - name: Lint
        run: ruff check app tests eval scripts
